<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — ReviewPro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
  .card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
  .logo{text-align:center;margin-bottom:28px}
  .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px}
  .logo h1{font-size:22px;font-weight:700;color:#0f172a}
  .logo p{font-size:13px;color:#64748b;margin-top:3px}
  .form-group{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;color:#0f172a;transition:border-color .2s,box-shadow .2s;outline:none}
  input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .btn{width:100%;padding:13px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:6px}
  .btn:hover{opacity:.92}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .links{text-align:center;margin-top:20px;font-size:13px;color:#64748b}
  .links a{color:#2563eb;text-decoration:none;font-weight:600}
  .links a:hover{text-decoration:underline}
  .divider{border:none;border-top:1px solid #e2e8f0;margin:20px 0}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⭐</div>
    <h1>ReviewPro</h1>
    <p>Plateforme d'avis patients intelligente</p>
  </div>

  <div class="error" id="errMsg"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="docteur@exemple.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">Se connecter</button>
  </form>

  <hr class="divider">
  <div class="links">
    Pas encore de compte ? <a href="/inscription">Créer un compte gratuit</a>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errMsg = document.getElementById('errMsg');
  errMsg.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Connexion…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = '/dashboard';
    } else {
      errMsg.textContent = data.error || 'Email ou mot de passe incorrect.';
      errMsg.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = 'Se connecter';
    }
  } catch(err) {
    errMsg.textContent = 'Erreur réseau. Réessayez.';
    errMsg.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = 'Se connecter';
  }
});
</script>
</body>
</html>

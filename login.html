<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — ReviewPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;min-height:100dvh;
  background:#F0FDFA;
  font-family:'Noto Sans',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.container{width:100%;max-width:420px}

/* Brand */
.brand{text-align:center;margin-bottom:32px}
.brand-logo{
  width:64px;height:64px;border-radius:18px;margin:0 auto 14px;
  background:linear-gradient(135deg,#0D9488,#22D3EE);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 6px rgba(0,0,0,.07);
}
.brand h1{font-size:26px;font-weight:800;color:#134E4A;letter-spacing:-.5px;font-family:'Figtree',system-ui,sans-serif}
.brand p{font-size:14px;color:#64748B;margin-top:4px}

/* Card */
.card{
  background:#fff;border-radius:20px;padding:36px 32px;
  border:1px solid #CCFBF1;
  box-shadow:0 4px 6px rgba(0,0,0,.07);
}
.card-title{font-size:20px;font-weight:700;color:#134E4A;margin-bottom:6px;font-family:'Figtree',system-ui,sans-serif}
.card-sub{font-size:13px;color:#64748B;margin-bottom:28px}

/* Form */
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
.input-wrap{position:relative}
input{
  width:100%;padding:13px 14px;border:2px solid #E2E8F0;border-radius:8px;
  font-size:14px;color:#134E4A;transition:border-color 200ms ease,box-shadow 200ms ease;outline:none;
  font-family:inherit;background:#fff;
}
input:focus{border-color:#0D9488;box-shadow:0 0 0 3px #0D948820}
input::placeholder{color:#94a3b8}
.toggle-pw{
  position:absolute;right:13px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:#94a3b8;font-size:18px;padding:4px;
  transition:color 200ms ease;
}
.toggle-pw:hover{color:#64748B}

/* Error */
.alert{
  border-radius:8px;padding:11px 14px;font-size:13px;margin-bottom:18px;
  display:none;align-items:center;gap:8px;
}
.alert.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.alert.success{background:#f0fdf4;border:1px solid #a7f3d0;color:#16a34a}

/* Button */
.btn{
  width:100%;padding:15px;border-radius:8px;border:none;cursor:pointer;
  font-size:15px;font-weight:700;transition:all 200ms ease;
  background:#0D9488;color:#fff;
  box-shadow:0 4px 6px rgba(0,0,0,.07);margin-top:4px;
  font-family:'Figtree',system-ui,sans-serif;
}
.btn:hover{background:#0f766e;transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

/* Spinner */
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Divider */
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#E2E8F0}
.divider span{font-size:12px;color:#94a3b8}

/* Links */
.links{text-align:center;font-size:13px;color:#64748B}
.links a{color:#0D9488;text-decoration:none;font-weight:600}
.links a:hover{text-decoration:underline}

/* Footer */
.footer-links{text-align:center;margin-top:24px}
.footer-links a{font-size:12px;color:#64748B;text-decoration:none}
.footer-links a:hover{color:#134E4A}
</style>
</head>
<body>
<div class="container">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
    <h1>ReviewPro</h1>
    <p>Plateforme d'avis patients intelligente</p>
  </div>

  <!-- Card -->
  <div class="card">
    <div class="card-title">Connexion</div>
    <div class="card-sub">Accédez à votre tableau de bord</div>

    <div class="alert error" id="alertError">⚠️ <span id="alertMsg"></span></div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="docteur@exemple.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pw" id="togglePw" onclick="togglePassword()" aria-label="Afficher le mot de passe"><svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">Se connecter</button>
    </form>

    <div class="divider"><span>ou</span></div>

    <div class="links">
      Pas encore de compte ?
      <a href="/inscription">Créer un compte médecin</a>
    </div>
  </div>

  <div class="footer-links">
    <a href="/">← Retour à l'accueil</a>
  </div>
</div>

<script>
function togglePassword() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const alertEl = document.getElementById('alertError');
  alertEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Connexion…';

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = data.onboarded ? '/dashboard' : '/onboarding';
    } else {
      document.getElementById('alertMsg').textContent = data.error || 'Email ou mot de passe incorrect.';
      alertEl.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = 'Se connecter';
    }
  } catch {
    document.getElementById('alertMsg').textContent = 'Erreur réseau. Réessayez.';
    alertEl.style.display = 'flex';
    btn.disabled = false;
    btn.innerHTML = 'Se connecter';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre avis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
body.positive{background:linear-gradient(160deg,#0f172a 0%,#064e3b 60%,#065f46 100%)}
body.negative{background:linear-gradient(160deg,#0f172a 0%,#1e3a5f 60%,#312e81 100%)}
body.loading{background:linear-gradient(160deg,#0f172a,#1e3a5f)}

.card{background:#fff;border-radius:24px;padding:36px 32px;width:100%;max-width:420px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.big-icon{font-size:72px;margin-bottom:16px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
h1{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:8px}
.sub{font-size:14px;color:#64748b;line-height:1.6;margin-bottom:24px}

/* Suggestion */
.suggestion-block{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:20px;text-align:left}
.suggestion-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.suggestion-text{font-size:14px;color:#374151;line-height:1.6;font-style:italic}
.copy-btn{margin-top:10px;width:100%;padding:9px;background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;transition:.2s}
.copy-btn:hover{background:#e2e8f0}
.copy-btn.copied{background:#ecfdf5;border-color:#a7f3d0;color:#059669}

/* Steps guide */
.steps-guide{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;text-align:left}
.step-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#f8fafc;border:1.5px solid #e2e8f0}
.step-item.done{background:#ecfdf5;border-color:#a7f3d0}
.step-item.active{background:#eff6ff;border-color:#bfdbfe}
.step-num{width:26px;height:26px;border-radius:50%;background:#e2e8f0;color:#64748b;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-item.done .step-num{background:#059669;color:#fff}
.step-item.active .step-num{background:#2563eb;color:#fff}
.step-text{font-size:13px;color:#374151;font-weight:500;line-height:1.4}
.step-text small{display:block;font-size:11px;color:#94a3b8;font-weight:400}

/* Auto-copy toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;animation:slideUp .3s ease;white-space:nowrap}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* Google button */
.google-btn{width:100%;padding:16px;background:linear-gradient(135deg,#1a73e8,#1557b0);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;transition:all .2s;text-decoration:none}
.google-btn:hover{opacity:.92;transform:translateY(-1px)}
.google-btn .g-icon{width:22px;height:22px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1a73e8;flex-shrink:0}

/* Negative */
.neg-block{background:#fef2f2;border:1.5px solid #fecaca;border-radius:14px;padding:20px;margin-bottom:20px;text-align:left}
.neg-block h3{font-size:15px;font-weight:700;color:#dc2626;margin-bottom:6px}
.neg-block p{font-size:13px;color:#374151;line-height:1.5;margin-bottom:14px}
.wa-btn{width:100%;padding:13px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:.2s}
.wa-btn:hover{opacity:.92}

.thanks-note{font-size:12px;color:#94a3b8;margin-top:16px}

/* SEO score badge */
.seo-badge{display:flex;align-items:center;gap:10px;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.seo-badge.excellent{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #6ee7b7}
.seo-badge.good{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1.5px solid #fbbf24}
.seo-badge-icon{font-size:22px;flex-shrink:0}
.seo-badge-text{flex:1}
.seo-badge-title{font-size:13px;font-weight:700;color:#065f46;margin-bottom:1px}
.seo-badge.good .seo-badge-title{color:#92400e}
.seo-badge-sub{font-size:11px;color:#6b7280}
.seo-score-bar{height:5px;background:#d1fae5;border-radius:3px;margin-top:5px;overflow:hidden}
.seo-badge.good .seo-score-bar{background:#fde68a}
.seo-score-fill{height:100%;background:linear-gradient(90deg,#059669,#10b981);border-radius:3px;transition:width .8s ease}
.seo-badge.good .seo-score-fill{background:linear-gradient(90deg,#d97706,#f59e0b)}
</style>
</head>
<body class="loading">
<div class="card" id="card">
  <div class="big-icon" id="mainIcon">⏳</div>
  <h1 id="mainTitle">Chargement…</h1>
  <div class="sub" id="mainSub"></div>
  <div id="mainContent"></div>
</div>

<script>
function trackGoogle(e) {
  e.preventDefault();
  const url = e.currentTarget.href;
  // Open immediately (before async) to avoid popup blockers
  window.open(url, '_blank');
  const feedbackId = window.__feedbackId;
  if (feedbackId) {
    fetch('/api/track-google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ feedback_id: feedbackId }),
    }).catch(() => {});
  }
}

function init() {
  const raw = sessionStorage.getItem('reviewResult');
  let data = null;
  try { data = raw ? JSON.parse(raw) : null; } catch(e) {}

  if (!data) {
    // Fallback: try URL params
    const params = new URLSearchParams(location.search);
    data = {
      type: params.get('type') || 'POSITIF',
      google_url: params.get('google_url') || '',
      suggestion: params.get('suggestion') || '',
      doctor_nom: params.get('nom') || '',
    };
  }

  window.__feedbackId = data.feedback_id || null;

  if (data.type === 'POSITIF') {
    renderPositive(data);
  } else {
    renderNegative(data);
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function autoCopyAndOpen(suggestion, googleUrl, feedbackId) {
  // Step 1: auto-copy text to clipboard
  navigator.clipboard.writeText(suggestion).then(() => {
    // Mark step 1 done, step 2 active
    document.getElementById('step1').className = 'step-item done';
    document.getElementById('step2').className = 'step-item active';
    showToast('✅ Avis copié dans le presse-papiers !');

    // Step 2: open Google Maps after short delay
    setTimeout(() => {
      document.getElementById('step2').className = 'step-item done';
      document.getElementById('step3').className = 'step-item active';

      // Track + open
      window.open(googleUrl, '_blank');
      if (feedbackId) {
        fetch('/api/track-google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ feedback_id: feedbackId }),
        }).catch(() => {});
      }
    }, 800);
  }).catch(() => {
    // Clipboard blocked (old browsers) — fallback: show copy button + open maps
    showToast('📋 Copiez votre avis, puis collez-le sur Google Maps');
    if (googleUrl) window.open(googleUrl, '_blank');
  });
}

function renderPositive(data) {
  document.body.className = 'positive';
  document.getElementById('mainIcon').textContent = '🎉';
  document.getElementById('mainTitle').textContent = 'Merci beaucoup !';
  document.getElementById('mainSub').textContent = 'Votre avis enrichi par l\'IA est prêt. Publiez-le sur Google Maps en un clic !';

  let html = '';

  if (data.suggestion) {
    // SEO score badge (if score available)
    if (data.seo_score != null && data.seo_score >= 60) {
      const isExcellent = data.seo_score >= 80;
      const cls = isExcellent ? 'excellent' : 'good';
      const icon = isExcellent ? '🏆' : '⚡';
      const title = isExcellent
        ? `Score SEO : ${data.seo_score}/100 — Excellent pour Google !`
        : `Score SEO : ${data.seo_score}/100 — Bon avis`;
      const sub = isExcellent
        ? 'Votre avis va maximiser la visibilité du médecin sur Google Maps'
        : 'Votre avis aidera le médecin à être mieux référencé';
      html += `
      <div class="seo-badge ${cls}">
        <div class="seo-badge-icon">${icon}</div>
        <div class="seo-badge-text">
          <div class="seo-badge-title">${title}</div>
          <div class="seo-badge-sub">${sub}</div>
          <div class="seo-score-bar"><div class="seo-score-fill" style="width:${data.seo_score}%"></div></div>
        </div>
      </div>`;
    }

    // Avis IA box (readonly, toujours visible)
    html += `
    <div class="suggestion-block">
      <div class="suggestion-label">✨ Votre avis enrichi par l'IA :</div>
      <div class="suggestion-text" id="suggText">${data.suggestion}</div>
      <button class="copy-btn" id="copyBtn" onclick="copySuggestion()">📋 Copier manuellement</button>
    </div>`;
  }

  if (data.google_url) {
    // 3-step visual guide
    html += `
    <div class="steps-guide">
      <div class="step-item active" id="step1">
        <div class="step-num">1</div>
        <div class="step-text">Votre avis est copié automatiquement
          <small>Prêt à coller dans Google Maps</small>
        </div>
      </div>
      <div class="step-item" id="step2">
        <div class="step-num">2</div>
        <div class="step-text">Google Maps s'ouvre
          <small>La page de review du médecin apparaît</small>
        </div>
      </div>
      <div class="step-item" id="step3">
        <div class="step-num">3</div>
        <div class="step-text">Collez et publiez
          <small>Appui long → Coller → Envoyer ⭐⭐⭐⭐⭐</small>
        </div>
      </div>
    </div>

    <a class="google-btn" href="${data.google_url}"
       onclick="event.preventDefault(); autoCopyAndOpen('${(data.suggestion||'').replace(/'/g,"\\'")}', '${data.google_url}', '${data.feedback_id||''}')">
      <div class="g-icon">G</div>
      Copier &amp; Publier sur Google Maps
    </a>`;
  } else {
    html += `<div style="background:#f1f5f9;border-radius:12px;padding:14px;font-size:13px;color:#64748b;margin-bottom:12px">✅ Votre avis a bien été enregistré. Merci !</div>`;
  }

  html += `<div class="thanks-note">Votre avis aide d'autres patients à trouver un bon médecin. Merci 🙏</div>`;
  document.getElementById('mainContent').innerHTML = html;

  // Auto-copy on page load if suggestion exists and Google URL is present
  if (data.suggestion && data.google_url) {
    setTimeout(() => {
      navigator.clipboard.writeText(data.suggestion).then(() => {
        if (document.getElementById('step1')) {
          document.getElementById('step1').className = 'step-item done';
          document.getElementById('step1').querySelector('.step-text').innerHTML =
            '✅ Avis copié automatiquement<small>Prêt à coller sur Google Maps</small>';
        }
        showToast('✅ Avis copié — cliquez le bouton Google Maps !');
      }).catch(() => {});
    }, 600);
  }
}

function renderNegative(data) {
  document.body.className = 'negative';
  document.getElementById('mainIcon').textContent = '🙏';
  document.getElementById('mainTitle').textContent = 'Merci pour votre retour';
  document.getElementById('mainSub').textContent = 'Nous prenons votre avis très au sérieux. Notre équipe va l\'examiner pour améliorer votre prochaine expérience.';

  let html = `
  <div class="neg-block">
    <h3>📞 Nous voulons arranger les choses</h3>
    <p>Si vous souhaitez qu'on vous rappelle ou que quelqu'un s'occupe de votre situation personnellement, contactez-nous directement.</p>`;

  if (data.wa_cabinet) {
    html += `<a class="wa-btn" href="${data.wa_cabinet}" target="_blank" rel="noopener">
      <span style="font-size:20px">💬</span> Contacter le cabinet sur WhatsApp
    </a>`;
  }

  html += `</div>`;
  html += `<div class="thanks-note">Votre confiance est importante pour nous. Merci de nous avoir aidés à nous améliorer. 🙏</div>`;
  document.getElementById('mainContent').innerHTML = html;
}

function copySuggestion() {
  const text = document.getElementById('suggText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ Copié !';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copier mon avis';
      btn.classList.remove('copied');
    }, 2500);
  });
}

init();
</script>
</body>
</html>
